<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>cyc</title>
<style>
  /* ============================================================
     第一页 · 新海诚风格晚霞天空 + 左侧少年
     右侧空白区叠加：艺术字标题 + 四枚横向长六边形按钮
     · 标题：明朝体白色艺术字，加粗放大、带收尾竖笔与短金线
     · 按钮：了解 / 同好 / 对话 / 联系（无英文）
             高透明轻磨砂底（背景图透出，blur 1px）+ 深蓝→玫瑰金 渐变描边
     · 含悬浮 / 点按 / 键盘聚焦特效
     · 点击按钮播放剧情转场（黑幕 + 章节名），跳转到 VN 子页面
     ============================================================ */

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: #16233d;
    color: #f2e8dc;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background-color: #16233d;
  }

  /* ---------- 背景：晚霞 + 左侧少年（沿用原取景规则） ---------- */
  .hero-bg {
    position: absolute;
    inset: 0;
    background-color: #16233d;
    background-image: url("assets/hero-scene.webp");
    background-repeat: no-repeat;
    background-position: 50% 50%;
    background-size: cover;
    transform-origin: 50% 50%;
    will-change: transform;
    animation: hero-breathe 26s ease-in-out infinite alternate;
  }

  /* 竖屏：横向裁切很大，左移取景以留住左侧的少年 */
  @media (max-aspect-ratio: 1/1) {
    .hero-bg { background-position: 4% 50%; }
  }

  /* 超宽屏：垂直裁切很大，下移取景以留住到膝盖的构图 */
  @media (min-aspect-ratio: 21/9) {
    .hero-bg { background-position: 46% 78%; }
  }

  /* ---------- 右侧 UI 容器 ---------- */
  .hero-ui {
    position: absolute;
    z-index: 2;
    top: 50%;
    right: clamp(22px, 5vw, 88px);
    width: min(32vw, 400px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* ---------- 标题艺术字 ----------
     明朝体 + 暖金渐变 + 细描边 + 双层柔光；比按钮宽出一截，形成主导感 */
  .title {
    width: max-content;
    margin: 0 0 14px;
    white-space: nowrap;
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP",
                 "MS PMincho", "SimSun", "Songti SC", serif;
    font-weight: 700;
    font-size: clamp(23px, 2.75vw, 40px);
    line-height: 1.28;
    letter-spacing: .13em;
    background-image: linear-gradient(180deg,
      #ffffff 0%, #fffbf4 32%, #fdf1e6 64%, #f9e7e0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: .85px rgba(36, 26, 52, .5);
    filter: drop-shadow(0 3px 16px rgba(10, 8, 26, .74))
            drop-shadow(0 0 30px rgba(255, 203, 138, .46));
  }

  /* 收尾竖笔：标题末尾一枚向下渐隐的短金竖线（和风落款感） */
  .title::after {
    content: "";
    display: inline-block;
    width: 2.6px;
    height: .9em;
    margin-left: .38em;
    vertical-align: -.08em;
    background-image: linear-gradient(180deg,
      rgba(250, 228, 190, .95) 0%, rgba(250, 228, 190, .34) 62%, rgba(250, 228, 190, 0) 100%);
  }

  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .title { color: #f7d9ae; background-image: none; }
  }

  /* 标题下的短金线：自左向右渐隐 */
  .title-rule {
    display: block;
    width: 172px;
    height: 1px;
    margin: 0 0 clamp(18px, 2.6vh, 30px);
    background-image: linear-gradient(90deg,
      rgba(246, 214, 170, .82), rgba(246, 214, 170, .12) 78%, rgba(246, 214, 170, 0));
  }

  /* ---------- 手写签名 ----------
     用户手写「陈弈畅」抠出来的原字（去掉了格纸），上「粉 → 白 → 蓝」渐变 + 双层柔光；
     落在左上角少年头顶上方那片天空里，比标题更抢眼 */
  .sign {
    position: absolute;
    z-index: 2;
    left: clamp(20px, 5.6vw, 92px);
    top: clamp(44px, 11vh, 124px);
    width: clamp(160px, 21vw, 350px);
    height: auto;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 6px 20px rgba(8, 10, 30, .5));
    animation: sign-in 1.1s cubic-bezier(.2, .8, .3, 1) .5s backwards,
               sign-float 7.5s ease-in-out 2.4s infinite alternate;
  }
  @keyframes sign-in {
    from { opacity: 0; transform: translateY(16px) scale(.955); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes sign-float {
    from { transform: translateY(0) rotate(-.35deg); }
    to   { transform: translateY(-8px) rotate(.35deg); }
  }

  /* ---------- 手写题字 ----------
     「无论你走到哪里，都请不要放弃希望」——同一支笔、同一套「粉 → 白 → 蓝」渐变，
     落在少年右手边那片天空里（大概和他的胸口齐平）
     2026-10-07 ①：按反馈放大（30vw→38vw，上限 460→600px）
     2026-10-07 ②：还是嫌小 —— 再放大到 44vw/640px、左移上移到 22%/58%；
       但 1024~1280 宽时「少年右缘 20.5% ～ 按钮列左缘」那条横带只有 42vw 左右，
       44vw 的尾巴会钻到按钮底下（1280 实测压 29px）。所以：
         · left: 22%  —— 少年右缘恒定在 ~20.5%，留一点缝
         · width 尽量大，再用 max-width 卡死在「按钮列左缘再退 24px」——
           公式里的 min(32vw,400px)/clamp(22px,5vw,88px) 必须和 .hero-ui 的
           width/right 保持一致（改按钮列布局时这里要跟着改）
         · 再加一层贴身暗描边：那一片是画面最亮的暖橙云，原来只有一层柔光，白字压上去会糊 */
  .wish {
    position: absolute;
    z-index: 2;
    left: 22%;
    top: 58%;
    width: clamp(240px, 44vw, 640px);
    max-width: calc(78vw - min(32vw, 400px) - clamp(22px, 5vw, 88px) - 24px);
    height: auto;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 1px 2px rgba(6, 8, 24, .85))
            drop-shadow(0 6px 18px rgba(8, 10, 30, .5));
    animation: sign-in 1.1s cubic-bezier(.2, .8, .3, 1) .95s backwards,
               sign-float 8.5s ease-in-out 2.9s infinite alternate;
  }

  /* ---------- 按钮列表 ---------- */
  .actions {
    display: flex;
    flex-direction: column;
    gap: clamp(13px, 1.8vh, 20px);
  }

  /* 横向较长六边形：左右切尖角 */
  @property --cut { syntax: "<length>"; inherits: true; initial-value: 15px; }

  .btn {
    --cut: 15px;
    --hex: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% 50%,
                   calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 50%);
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    filter: drop-shadow(0 6px 16px rgba(6, 12, 32, .5))
            drop-shadow(0 1px 2px rgba(6, 12, 32, .38));
    transition: transform .26s cubic-bezier(.2, .8, .25, 1), filter .26s ease, --cut .3s ease;
    -webkit-tap-highlight-color: transparent;
  }

  /* 渐变描边层（深蓝 → 玫瑰金），描边略厚以强化质感 */
  .btn-box {
    display: block;
    padding: 1.6px;
    clip-path: var(--hex);
    background-image: linear-gradient(100deg,
      #2e4a8c 0%, #7a8dbc 9%, #c6a079 24%, #f3dcb6 40%,
      #e3a98a 55%, #a88bb0 72%, #3c55a2 100%);
    background-size: 190% 100%;
    background-position: 0% 0;
    transition: background-position .55s ease, filter .26s ease;
  }

  /* 高透明轻磨砂底：背景图透出，模糊极轻（blur 1px） */
  .btn-face {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(11px, 1.7vh, 17px) 22px;
    clip-path: var(--hex);
    background-color: rgba(9, 20, 52, .2);
    -webkit-backdrop-filter: blur(1px) saturate(1.05);
    backdrop-filter: blur(1px) saturate(1.05);
    transition: background-color .26s ease;
  }

  /* 按钮文字：明朝体，左右各配一枚短金线 */
  .btn-label {
    display: block;
    text-align: center;
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP",
                 "MS PMincho", "SimSun", "Songti SC", serif;
    font-size: clamp(14px, 1.2vw, 17px);
    font-weight: 600;
    letter-spacing: .3em;
    text-indent: .3em;
    color: #f7ead6;
    text-shadow: 0 1px 10px rgba(4, 6, 18, .9), 0 0 3px rgba(4, 6, 18, .55);
    transition: color .26s ease, text-shadow .26s ease;
  }

  .btn-label::before,
  .btn-label::after {
    content: "";
    display: inline-block;
    width: 16px;
    height: 1px;
    vertical-align: middle;
    margin: 0 .85em;
    opacity: .5;
    transition: width .3s ease, opacity .3s ease;
  }
  .btn-label::before { background-image: linear-gradient(90deg, transparent, currentColor 62%, currentColor); }
  .btn-label::after  { background-image: linear-gradient(90deg, currentColor, currentColor 38%, transparent); }

  /* ---------- 悬浮（只做位移 / 描边流光 / 文字变化，不做反光） ---------- */
  .btn:hover {
    --cut: 22px;
    transform: translateY(-2px) scale(1.012);
    filter: drop-shadow(0 12px 26px rgba(6, 12, 32, .56)) brightness(1.08);
  }
  .btn:hover .btn-box { background-position: 100% 0; }
  .btn:hover .btn-face {
    background-color: rgba(255, 255, 255, .07);
  }
  .btn:hover .btn-label { color: #ffffff; }
  .btn:hover .btn-label::before,
  .btn:hover .btn-label::after {
    width: 24px;
    opacity: .9;
    animation: btn-shimmer 1.8s ease-in-out infinite;
  }

  /* ---------- 点按 ---------- */
  .btn:active {
    transform: translateY(0) scale(.982);
    filter: drop-shadow(0 3px 10px rgba(6, 12, 32, .5)) brightness(.94);
    transition-duration: .09s;
  }
  .btn:active .btn-face {
    background-color: rgba(255, 255, 255, .13);
  }

  /* ---------- 键盘聚焦 ---------- */
  .btn:focus-visible { outline: none; }
  .btn:focus-visible .btn-box { filter: brightness(1.18) saturate(1.08); }
  .btn:focus-visible .btn-face { box-shadow: inset 0 0 0 2px rgba(255, 216, 166, .85); }

  /* ---------- 窄屏 / 竖屏兜底：UI 收在画面上方 ----------
     竖屏取景下少年落在画面下方，UI 压住他会挡人，故改为顶部对齐 */
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .hero-ui {
      top: clamp(20px, 6vh, 60px);
      bottom: auto;
      right: clamp(18px, 5vw, 40px);
      left: clamp(18px, 5vw, 40px);
      width: auto;
      transform: none;
    }
    .title { width: max-content; font-size: clamp(18px, 6.2vw, 30px); margin-bottom: 12px; }
    .title-rule { width: 132px; margin-bottom: 18px; }
    .btn { --cut: 13px; }
    .btn-label { font-size: 14px; }
    /* 竖屏/窄屏：UI 已经占住上方，签名挪到右上角的空白天空里 */
    .sign {
      left: auto;
      right: clamp(18px, 5vw, 40px);
      top: clamp(24px, 4.6vh, 50px);
      width: clamp(118px, 33vw, 186px);
    }
    /* 竖屏/窄屏：取景左移后少年落在偏左，题字贴右侧天空，仍在他右手边；
       同上放大一档（42vw→48vw，上限 300→340px）；
       top 66%→74%：窄屏 UI 收在顶部成一条，小条底部约在 62~74vh，
       66% 时题字顶边会钻到小条底下（860×600 / 320×568 实测），下移一档让开；
       max-width 必须撤掉——桌面那条「卡按钮列左缘」的公式在这里会把窄屏卡得更窄 */
    .wish {
      left: auto;
      right: clamp(10px, 3.5vw, 24px);
      top: 74%;
      width: clamp(150px, 48vw, 340px);
      max-width: none;
    }
    /* 窄屏/竖屏：天气只留「城市 — 天气 温度」一行（详细项藏起来），
       并把这一行钻到顶部那条 UI 之上——这两条写在下面的窄屏块里，
       因为媒体查询不加权重，同权重得靠源码顺序才压得住上面的 .wx 定义 */
  }

  /* ---------- 极矮横屏（手机横放）：整页本来就挤不下，题字与天气小条先让位，别压在按钮上 ---------- */
  @media (max-height: 420px) {
    .wish { display: none; }
    .wx { display: none; }   /* 小条会把按钮列再顶高一截，这里的屏已经装不下 */
  }

  /* ---------- 无障碍：减少动态效果 ---------- */
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn-box, .btn-face, .btn-label,
    .btn-label::before, .btn-label::after { transition: none; }
    .btn:hover { transform: none; --cut: 15px; }
    .hero-bg { animation: none; }
    .chapter, .title, .title-rule, .actions .btn, .hero-hint, .sign, .wish, .wx { animation: none !important; }
    .hero-hint span { animation: none; }
    .btn:hover .btn-label::before,
    .btn:hover .btn-label::after { animation: none; }
  }
  /* ---------- 序章标记 + 入口提示（VN 标题画面感） ---------- */
  .chapter {
    display: block;
    margin: 0 0 10px;
    font-family: "Yu Mincho", "YuMincho", "MS PMincho", "SimSun", serif;
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: .38em;
    color: rgba(246, 214, 170, .85);
    text-shadow: 0 2px 10px rgba(4, 6, 18, .85);
  }
  .hero-hint {
    position: absolute;
    z-index: 2;
    left: 0; right: 0;
    bottom: clamp(16px, 3vh, 30px);
    margin: 0;
    text-align: center;
    font-family: "Yu Mincho", "YuMincho", "MS PMincho", "SimSun", serif;
    font-size: 12px;
    letter-spacing: .28em;
    text-indent: .28em;
    color: rgba(246, 214, 170, .78);
    text-shadow: 0 2px 10px rgba(4, 6, 18, .9);
  }
  .hero-hint span { display: inline-block; animation: hint-pulse 2.4s ease-in-out infinite; }

  /* ---------- 天气：页面正上方一小行 ----------
     数据来自服务端 GET ?wx=1（Open-Meteo，公开信息）；函数没部署时脚本会直连
     Open-Meteo 兜底（见 assets/weather.js）；两条路都不通就整行不显示。
     2026-10-08 ③：反馈「不要把天气做成按钮」——原来是照抄按钮的切角六边形+渐变描边+
     磨砂底，确实像第五个按钮。改成**页面正上方的一行小字**：没有外框、没有底色、没有切角，
     只在字形上加一点暗描边，压在什么天色上都读得清。
     窄屏只留「城市 — 天气 温度」（详细项 .wx-sub 藏起来，见下面的窄屏块）。
     定位用 left/right:0 + text-align:center（不用 left:50% + translateX(-50%)，
     否则入场动画的 transform 会把水平居中覆盖掉）。 */
  .wx {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    top: clamp(8px, 1.6vh, 18px);
    padding: 0 14px;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .wx[hidden] { display: none; }

  .wx-box { display: inline-block; max-width: 100%; }

  .wx-face {
    display: inline-flex;
    align-items: center;
    gap: .55em;
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho",
                 "SimSun", "Songti SC", serif;
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: .18em;
    color: rgba(247, 234, 214, .9);
    text-shadow: 0 1px 8px rgba(4, 6, 18, .92), 0 0 3px rgba(4, 6, 18, .6);
    white-space: nowrap;
  }

  .wx-line { display: inline-flex; align-items: center; gap: .5em; }
  .wx-city { font-weight: 600; }
  .wx-rule {
    width: 13px; height: 1px; flex: none;
    background-image: linear-gradient(90deg, rgba(246, 214, 170, .85), rgba(246, 214, 170, .15));
  }
  .wx-now { font-weight: 600; color: #f7ead6; }
  /* 详细项跟主行同排，前面再配一枚小短划当分隔 */
  .wx-sub { color: rgba(246, 214, 170, .62); }
  .wx-sub::before {
    content: "";
    display: inline-block;
    width: 13px; height: 1px;
    margin-right: .55em;
    vertical-align: middle;
    background-image: linear-gradient(90deg, rgba(246, 214, 170, .55), rgba(246, 214, 170, .12));
  }

  /* 入场：跟着签名/题字一起淡入上移 */
  .wx { animation: sign-in 1.1s cubic-bezier(.2, .8, .3, 1) 1.3s backwards; }

  /* ---------- 窄屏 / 竖屏的天气收尾（必须放在 .wx 定义之后） ----------
     媒体查询不加权重：同权重看源码顺序，写在上面会被上面的 .wx 顶掉（踩过）。
     ① 只留「城市 — 天气 温度」一行，详细项藏起来；
     ② 钻到顶部那条 UI 之上——窄屏 UI top 是 clamp(20px,6vh,60px)，这一行高 20px，
        top 取 clamp(4px,1.1vh,12px)：421px 高的窗口（最短的非隐藏档）也还留 1.7px 缝。 */
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .wx { top: clamp(4px, 1.1vh, 12px); }
    .wx-sub { display: none; }
  }

  /* 入场：标题 / 金线 / 按钮依次淡入上移 */
  @keyframes hero-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes hero-fade {
    from { opacity: 0; transform: translateY(12px); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes hero-rule-in {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }
  @keyframes hero-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
  @keyframes btn-shimmer { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes hint-pulse {
    0%, 100% { opacity: .45; transform: translateY(0); }
    50%      { opacity: .95; transform: translateY(-3px); }
  }
  .chapter  { animation: hero-fade .8s cubic-bezier(.2, .8, .3, 1) .15s backwards; }
  .title    { animation: hero-up .9s cubic-bezier(.2, .8, .3, 1) .3s backwards; }
  .title-rule { transform-origin: 0 50%; animation: hero-rule-in .8s ease-out .62s backwards; }
  .actions .btn { animation: hero-up .7s cubic-bezier(.2, .8, .3, 1) backwards; }
  .actions .btn:nth-child(1) { animation-delay: .78s; }
  .actions .btn:nth-child(2) { animation-delay: .9s; }
  .actions .btn:nth-child(3) { animation-delay: 1.02s; }
  .actions .btn:nth-child(4) { animation-delay: 1.14s; }
  .hero-hint { animation: hero-up .8s ease-out 1.5s backwards; }

  /* ---------- 剧情转场遮罩（VN 风格） ---------- */
  .vn-curtain {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #05070f;
    opacity: 0;
    pointer-events: none;
  }
  .vn-curtain.closing {
    pointer-events: auto;
    animation: vn-close .62s cubic-bezier(.5, 0, .9, .4) both;
  }
  @keyframes vn-close { from { opacity: 0; } to { opacity: 1; } }
  .vn-curtain .ct-chapter {
    font-family: "Yu Mincho", "YuMincho", "MS PMincho", "SimSun", serif;
    font-size: clamp(13px, 1.5vw, 16px);
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(246, 214, 170, .9);
    opacity: 0;
  }
  .vn-curtain .ct-title {
    margin: 14px 0 0;
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP",
                 "MS PMincho", "SimSun", serif;

  @keyframes vn-ct {

  @media (prefers-reduced-motion: reduce) {
