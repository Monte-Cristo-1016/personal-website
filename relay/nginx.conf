# vn-relay · nginx 版（已有 nginx 的 VPS 用这个）
#
# 放到 /etc/nginx/conf.d/vn-relay.conf，然后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：推荐 certbot
#   sudo certbot --nginx -d vn-api.你的域名.com
# 没域名可以用 sslip.io / nip.io：
#   sudo certbot --nginx -d vn-api.1.2.3.4.sslip.io

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name vn-api.你的域名.com;   # ← 换成你的

    ssl_certificate     /etc/letsencrypt/live/vn-api.你的域名.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vn-api.你的域名.com/privkey.pem;

    location / {
        proxy_pass https://zhklmnxtdzhkouwfyghr.supabase.co;

        # 关键三条
        proxy_ssl_server_name on;                              # SNI 必须是源站域名
        proxy_set_header Host zhklmnxtdzhkouwfyghr.supabase.co; # 否则 Supabase 回 404
        proxy_buffering off;                                    # 分身是流式的，别攒
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
